<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPilot</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/workspace.js"></script>
</head>
<body>
    <h1>WorkSpace</h1>
    <div class="view_task">
        <table>
            <thead>
                <th>Description</th>
                <th>Date & Time</th>
            </thead> 
    
            <tbody id="task_table">
                <tr>
                    <td><input type="text" id="descr"></td>
                    <td><input type="date" id="date"></td>
                    <td><input type="time" id="time"></td>
                    <td><button id="btn_addTask">+</button></td>
                </tr>
            </tbody>

        </table>
    </div>

    </body>
</html>
